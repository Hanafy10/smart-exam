services:
  db:
    image: mysql:8.0
    container_name: smart_exam_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-SmartExamRoot123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-smart_exam}
      - MYSQL_USER=${MYSQL_USER:-smart_exam_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-SmartExam123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-SmartExamRoot123}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart_exam_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-smart-exam-super-secret-key-graduation-project-2026}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_HOURS=${REFRESH_TOKEN_EXPIRE_HOURS:-2}
      - MAX_LOGIN_ATTEMPTS=${MAX_LOGIN_ATTEMPTS:-5}
      - LOCK_MINUTES=${LOCK_MINUTES:-15}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-10}
      - RATE_LIMIT_WINDOW_MINUTES=${RATE_LIMIT_WINDOW_MINUTES:-1}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-mysql+aiomysql://smart_exam_user:SmartExam123@db:3306/smart_exam}
      - EVIDENCE_DIR=${DOCKER_EVIDENCE_DIR:-/app/evidence}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-[EMAIL_ADDRESS]}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin@12345678}
      - DEFAULT_ROOM_NAME=${DEFAULT_ROOM_NAME:-Hall 101}
      - DEFAULT_ROOM_BUILDING=${DEFAULT_ROOM_BUILDING:-Engineering Complex A}
      - DEFAULT_ROOM_CAPACITY=${DEFAULT_ROOM_CAPACITY:-40}
      - DEFAULT_CAMERA_NAME=${DEFAULT_CAMERA_NAME:-Ceiling Overhead Cam 1}
      - DEFAULT_CAMERA_DEVICE=${DEFAULT_CAMERA_DEVICE:-0}
      - ROBOT_HEARTBEAT_INTERVAL=${ROBOT_HEARTBEAT_INTERVAL:-30}
      - ROBOT_OFFLINE_TIMEOUT=${ROBOT_OFFLINE_TIMEOUT:-90}
    volumes:
      - ./evidence:/app/evidence
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.1.9:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://192.168.1.9:8000/ws/dashboard}
        NEXT_PUBLIC_DEFAULT_LOGIN_USER: ${NEXT_PUBLIC_DEFAULT_LOGIN_USER:-admin}
        NEXT_PUBLIC_DEFAULT_LOGIN_PASS: ${NEXT_PUBLIC_DEFAULT_LOGIN_PASS:-Admin@12345678}
    container_name: smart_exam_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://192.168.1.9:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://192.168.1.9:8000/ws/dashboard}
      - NEXT_PUBLIC_DEFAULT_LOGIN_USER=${NEXT_PUBLIC_DEFAULT_LOGIN_USER:-admin}
      - NEXT_PUBLIC_DEFAULT_LOGIN_PASS=${NEXT_PUBLIC_DEFAULT_LOGIN_PASS:-Admin@12345678}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: smart_exam_ai
#    gpus: all
    env_file:
      - .env
    environment:
      - BACKEND_URL=${DOCKER_BACKEND_URL:-http://backend:8000}
      - ROOM_ID=${ROOM_ID:-1}
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - CAMERA_WIDTH=${CAMERA_WIDTH:-1280}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT:-720}
      - CAMERA_FPS=${CAMERA_FPS:-30}
      - DISPLAY_GUI=${DOCKER_DISPLAY_GUI:-false}
      - BRIGHTNESS_ALPHA=${BRIGHTNESS_ALPHA:-1.3}
      - BRIGHTNESS_BETA=${BRIGHTNESS_BETA:-20}
      - YOLO_MODEL_PATH=${YOLO_MODEL_PATH:-yolov8n.pt}
      - PERSON_CONFIDENCE_THRESHOLD=${PERSON_CONFIDENCE_THRESHOLD:-0.5}
      - OBJECT_CONFIDENCE_THRESHOLD=${OBJECT_CONFIDENCE_THRESHOLD:-0.4}
      - FACE_CONFIDENCE_THRESHOLD=${FACE_CONFIDENCE_THRESHOLD:-0.5}
      - SETUP_FRAMES=${SETUP_FRAMES:-30}
      - MAX_DISAPPEARED_FRAMES=${MAX_DISAPPEARED_FRAMES:-30}
      - SUSPICIOUS_SCORE_THRESHOLD=${SUSPICIOUS_SCORE_THRESHOLD:-10}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./evidence:/app/evidence
    restart: unless-stopped
    # devices:
    #   - /dev/video0:/dev/video0


volumes:
  db_data:
