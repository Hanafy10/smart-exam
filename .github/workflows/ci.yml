name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile dashboard.py robot_controller.py object_detector.py \
            face_detector.py eye_gaze.py person_detector.py \
            boundary_zones.py scoring_system.py camera_capture.py

      - name: Run style check (ruff)
        run: |
          pip install ruff
          ruff check . --ignore=E501,W293

      - name: Run type check (mypy) - optional
        continue-on-error: true
        run: |
          pip install mypy
          mypy --ignore-missing-imports dashboard.py robot_controller.py object_detector.py

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: smart-exam:latest
          load: true

      - name: Test container starts
        run: |
          docker run --rm -d --name test-smart-exam smart-exam:latest
          sleep 5
          docker stop test-smart-exam